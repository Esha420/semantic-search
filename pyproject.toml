[project]
name = "document-intelligence-rag"
version = "1.0.0"
description = "Production-grade RAG and Document Intelligence API with PostgreSQL/pgvector, Hybrid Search, NVIDIA NIM, and Citations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Verisk AI Candidate", email = "candidate@example.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "pymupdf>=1.24.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
celery = [
    "celery>=5.4.0",
    "redis>=5.0.8",
]
ui = [
    "streamlit>=1.38.0",
]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
